
<!DOCTYPE html>
<html>
<head>
    <title>Student Marks Calculator</title>
</head>

<body>

<center>

<h2>Student Marks & Grade Calculator</h2>

<table border="1" cellpadding="12" width="450">

<tr>
<td>

<form onsubmit="return submitData()">

<label>Name</label>

<input type="text" id="name" required>

<br><br><br>

<label>Gender</label>

<input type="radio" name="gender" value="Male" checked> M

<input type="radio" name="gender" value="Female"> F

<br><br><br>

<label>Course</label>

<br><br>

<input type="checkbox" name="course" value="HNDIT"> HNDIT

<br><br>

<input type="checkbox" name="course" value="HNDA"> HNDA

<br><br>

<input type="checkbox" name="course" value="HNDE"> HNDE

<br><br><br>

<table border="1" cellpadding="8" width="100%">

<tr>
    <th>Subject</th>
    <th>Marks</th>
    <th>Grade</th>
</tr>

<tr>
    <td>ML</td>
    <td><input type="number" id="ml" min="0" max="100"></td>
    <td><input type="text" id="mlg" size="3" readonly></td>
</tr>

<tr>
    <td>CN</td>
    <td><input type="number" id="cn" min="0" max="100"></td>
    <td><input type="text" id="cng" size="3" readonly></td>
</tr>

<tr>
    <td>EA</td>
    <td><input type="number" id="ea" min="0" max="100"></td>
    <td><input type="text" id="eag" size="3" readonly></td>
</tr>

</table>

<br><br>

<label>Average</label>

<input type="text" id="average" readonly size="12">

<br><br>

<center>

<input type="submit" value="Submit">

&nbsp;&nbsp;&nbsp;&nbsp;

<input type="button" value="Click" onclick="calculate()">

</center>

<br>

<p id="result"></p>

</form>

</td>
</tr>

</table>

</center>

<script>

function getGrade(mark) {

    if(mark >= 80) {
        return "A";
    }

    else if(mark >= 60) {
        return "B";
    }

    else if(mark >= 40) {
        return "C";
    }

    else {
        return "D";
    }

}


function calculate() {

    let ml = document.getElementById("ml").value;
    let cn = document.getElementById("cn").value;
    let ea = document.getElementById("ea").value;

    if(ml === "" || cn === "" || ea === "") {
        alert("Please enter all marks!");
        return;
    }

    ml = Number(ml);
    cn = Number(cn);
    ea = Number(ea);

    if(ml < 0 || ml > 100 ||
       cn < 0 || cn > 100 ||
       ea < 0 || ea > 100) {

        alert("Enter marks between 0 and 100!");
        return;
    }

    document.getElementById("mlg").value = getGrade(ml);

    document.getElementById("cng").value = getGrade(cn);

    document.getElementById("eag").value = getGrade(ea);

    let total = ml + cn + ea;

    let avg = total / 3;

    document.getElementById("average").value =
        avg.toFixed(2);

    document.getElementById("result").innerHTML =
        "Marks Calculated Successfully!";

}


function submitData() {

    let name = document.getElementById("name").value;

    let courses = document.querySelectorAll(
        'input[name="course"]:checked'
    );

    if(courses.length == 0) {
        alert("Please select a course!");
        return false;
    }

    let selected = [];

    courses.forEach(function(course) {
        selected.push(course.value);
    });

    alert(
        "Name: " + name +
        "\nCourses: " + selected.join(", ")
    );

    return false;

}

</script>

</body>
</html>
