
<!DOCTYPE html>
<html>
<head>
    <title>Student Grade System</title>
    <style>
        body {
            font-family: Arial;
            background: #eef4ff;
            margin: 0;
            padding: 30px;
        }

        .container {
            width: 480px;
            max-width: 95%;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 20px #ccd8ee;
        }

        h2 {
            text-align: center;
            color: #2563eb;
        }

        label {
            display: block;
            margin-top: 18px;
            font-weight: bold;
        }

        input[type=text] {
            width: 95%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 7px;
        }

        .option {
            display: inline-block;
            margin: 10px 8px 0 0;
        }

        table {
            width: 100%;
            margin-top: 15px;
            border-collapse: collapse;
        }

        th, td {
            padding: 12px 5px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #edf2ff;
            font-size: 12px;
        }

        input[type=number] {
            width: 75px;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            padding: 13px;
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            width: 48%;
        }

        .calculate {
            background: #2563eb;
        }

        .show {
            background: #089bd5;
        }

        .buttons {
            display: flex;
            justify-content: space-between;
            margin-top: 25px;
        }

        #message {
            color: red;
            font-size: 13px;
        }
    </style>
</head>

<body>

<div class="container">

<h2>STUDENT GRADE SYSTEM</h2>

<form>

<label>Name</label>
<input type="text" id="name" placeholder="Enter student name">

<label>Gender</label>

<div class="option">
<input type="radio" name="gender" value="Male"> Male
</div>

<div class="option">
<input type="radio" name="gender" value="Female"> Female
</div>

<label>Course</label>

<div class="option">
<input type="checkbox" name="course" value="HNDIT"> HNDIT
</div>

<div class="option">
<input type="checkbox" name="course" value="HNDSE"> HNDSE
</div>

<div class="option">
<input type="checkbox" name="course" value="HNDJA"> HNDJA
</div>

<label>Subject Marks</label>

<table>
<tr>
<th>SUBJECT</th>
<th>MARKS</th>
<th>GRADE</th>
</tr>

<tr>
<td>Machine Learning</td>
<td><input type="number" id="m1" min="0" max="100"></td>
<td id="g1">-</td>
</tr>

<tr>
<td>Computer Network</td>
<td><input type="number" id="m2" min="0" max="100"></td>
<td id="g2">-</td>
</tr>

<tr>
<td>Architecture</td>
<td><input type="number" id="m3" min="0" max="100"></td>
<td id="g3">-</td>
</tr>

<tr>
<td><b>Average</b></td>
<td colspan="2" id="avg">-</td>
</tr>
</table>

<p id="message"></p>

<div class="buttons">

<button type="button" class="calculate"
onclick="calculate()">Calculate</button>

<button type="button" class="show"
onclick="showResult()">Show</button>

</div>

</form>
</div>

<script>

function grade(mark) {
    if(mark >= 75) return "A";
    if(mark >= 65) return "B";
    if(mark >= 50) return "C";
    if(mark >= 40) return "S";
    return "F";
}

function getData() {

    let name = document.getElementById("name").value.trim();

    let gender = document.querySelector(
        'input[name="gender"]:checked'
    );

    let courses = [];

    document.querySelectorAll(
        'input[name="course"]:checked'
    ).forEach(c => courses.push(c.value));

    let marks = [
        document.getElementById("m1").value,
        document.getElementById("m2").value,
        document.getElementById("m3").value
    ];

    if(name === "") throw "Enter student name";
    if(!gender) throw "Select gender";
    if(courses.length === 0) throw "Select course";

    if(marks.some(m => m === "" || Number(m) < 0 || Number(m) > 100))
        throw "Enter marks between 0 and 100";

    marks = marks.map(Number);

    let average = (marks[0] + marks[1] + marks[2]) / 3;

    return {
        name: name,
        gender: gender.value,
        courses: courses,
        marks: marks,
        grades: marks.map(grade),
        average: average.toFixed(2),
        overallGrade: grade(average)
    };
}

function calculate() {

    try {
        let data = getData();

        document.getElementById("g1").innerHTML = data.grades[0];
        document.getElementById("g2").innerHTML = data.grades[1];
        document.getElementById("g3").innerHTML = data.grades[2];

        document.getElementById("avg").innerHTML =
            data.average + "% (" + data.overallGrade + ")";

        document.getElementById("message").innerHTML = "";

        localStorage.setItem("student", JSON.stringify(data));

    } catch(error) {
        document.getElementById("message").innerHTML = error;
    }
}

function showResult() {

    try {
        let data = getData();

        localStorage.setItem("student", JSON.stringify(data));

        window.location.href = "result.html";

    } catch(error) {
        document.getElementById("message").innerHTML = error;
    }
}

</script>

</body>
</html>
